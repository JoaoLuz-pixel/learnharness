name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          # GitHub's native Windows ARM64 runner (free for public repos).
          - os: windows-11-arm
            platform: windows-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    # Windows ARM64 runners need ~20 min for npm ci + plugins:setup alone
    # (x64: ~5 min); its build and checks run at x64 speed. Fork, 2026-11-23.
    timeout-minutes: ${{ matrix.platform == 'windows-arm64' && 45 || 25 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Experiment (fork, 2026-11-23): on the throwaway Windows ARM64 runner,
      # npm installs are slowed by real-time scanning of every unpacked file.
      # Exclude the build folders from Defender; never fails the job, and logs
      # whether the exclusions took effect so the gain can be judged.
      - name: Speed up installs on Windows ARM64 (Defender exclusions)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, "C:\npm\cache", $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, "$env:LOCALAPPDATA\Temp")
          try { Add-MpPreference -ExclusionPath $paths -ErrorAction Stop; "Defender exclusions added: $($paths -join ', ')" }
          catch { "Defender exclusions not applied: $($_.Exception.Message)" }
          try { $s = Get-MpComputerStatus -ErrorAction Stop; "Real-time protection enabled: $($s.RealTimeProtectionEnabled)" }
          catch { "Defender status unavailable: $($_.Exception.Message)" }
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      # Plan map labels fit their boxes in real Chrome, in any font (#671).
      - run: node scripts/smoke-plan-labels.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
